<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>角丝旁行侠记 · 第二章</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23a83232'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23f4e9d0' font-family='KaiTi,serif'%3E%E4%BE%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="c2">
  <!-- 县衙场景 -->
  <div class="c2-scene">
    <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="yWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46321d"/><stop offset="1" stop-color="#2a1c0f"/></linearGradient>
        <linearGradient id="yFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#573b23"/><stop offset="1" stop-color="#36220f"/></linearGradient>
        <radialGradient id="yGlow" cx="50%" cy="34%" r="58%"><stop offset="0" stop-color="#ffdf9a" stop-opacity=".24"/><stop offset="1" stop-color="#ffdf9a" stop-opacity="0"/></radialGradient>
        <clipPath id="winClip"><rect x="505" y="140" width="270" height="248"/></clipPath>
      </defs>
      <rect width="1280" height="720" fill="url(#yWall)"/>
      <path d="M 0 470 L 1280 470 L 1280 720 L 0 720 Z" fill="url(#yFloor)"/>
      <line x1="0" y1="470" x2="1280" y2="470" stroke="#1f1208" stroke-width="4"/>
      <g stroke="#2a180c" stroke-width="2" opacity=".55">
        <line x1="0" y1="522" x2="1280" y2="522"/><line x1="0" y1="584" x2="1280" y2="584"/><line x1="0" y1="650" x2="1280" y2="650"/>
      </g>
      <rect width="1280" height="720" fill="url(#yGlow)"/>

      <!-- 匾额 -->
      <rect x="470" y="34" width="340" height="86" rx="8" fill="#8a5a20" stroke="#d9b06a" stroke-width="4"/>
      <rect x="483" y="46" width="314" height="62" rx="4" fill="#1c1410" stroke="#d9b06a" stroke-width="2"/>
      <text x="640" y="91" text-anchor="middle" font-size="40" fill="#f4e9d0" font-family="KaiTi,serif" letter-spacing="10">明镜高悬</text>

      <!-- 窗（居中）：窗外下雨打雷 -->
      <rect x="498" y="132" width="284" height="264" rx="6" fill="#0e1626" stroke="#5a3a22" stroke-width="10"/>
      <g clip-path="url(#winClip)">
        <rect x="505" y="140" width="270" height="248" fill="#0e1626"/>
        <g fill="#18223c" opacity=".85">
          <ellipse cx="520" cy="152" rx="72" ry="22"/>
          <ellipse cx="606" cy="142" rx="82" ry="26"/>
          <ellipse cx="700" cy="150" rx="74" ry="22"/>
          <ellipse cx="765" cy="146" rx="58" ry="18"/>
        </g>
        <g class="yrain" clip-path="url(#winClip)" stroke="#9ab8d0" stroke-width="2" opacity=".5">
          <line x1="515" y1="-120" x2="503" y2="-60"/><line x1="545" y1="-140" x2="533" y2="-80"/>
          <line x1="575" y1="-120" x2="563" y2="-60"/><line x1="605" y1="-150" x2="593" y2="-90"/>
          <line x1="635" y1="-120" x2="623" y2="-60"/><line x1="665" y1="-140" x2="653" y2="-80"/>
          <line x1="695" y1="-120" x2="683" y2="-60"/><line x1="725" y1="-150" x2="713" y2="-90"/>
          <line x1="755" y1="-120" x2="743" y2="-60"/><line x1="530" y1="-90" x2="518" y2="-30"/>
          <line x1="590" y1="-110" x2="578" y2="-50"/><line x1="650" y1="-100" x2="638" y2="-40"/>
          <line x1="710" y1="-110" x2="698" y2="-50"/><line x1="770" y1="-100" x2="758" y2="-40"/>
        </g>
        <path class="ybolt" d="M 645 132 L 612 222 L 640 220 L 600 322 L 668 210 L 642 214 L 682 132 Z" fill="#eaf2ff"/>
        <rect class="yflash" x="505" y="140" width="270" height="248" fill="#d6e4ff"/>
      </g>
      <line x1="640" y1="132" x2="640" y2="396" stroke="#5a3a22" stroke-width="7"/>
      <line x1="498" y1="264" x2="782" y2="264" stroke="#5a3a22" stroke-width="7"/>
      <rect x="498" y="132" width="284" height="264" fill="none" stroke="#3a2418" stroke-width="3"/>

      <!-- 山水屏风（左） -->
      <rect x="110" y="180" width="200" height="300" rx="6" fill="#3a2418" stroke="#5a3a22" stroke-width="3"/>
      <path d="M 132 216 Q 210 270 288 216" stroke="#8a6a3a" stroke-width="3" fill="none"/>
      <circle cx="210" cy="262" r="30" fill="none" stroke="#8a6a3a" stroke-width="3"/>
      <path d="M 162 462 Q 210 422 258 462" stroke="#6a4a28" stroke-width="3" fill="none"/>

      <!-- 书案（右） -->
      <rect x="900" y="452" width="300" height="18" rx="4" fill="#6b4a2f" stroke="#3a2418" stroke-width="2"/>
      <rect x="920" y="470" width="16" height="90" fill="#4a3018"/>
      <rect x="1162" y="470" width="16" height="90" fill="#4a3018"/>
      <rect x="928" y="424" width="120" height="26" rx="3" fill="#e8dcc0"/>
      <line x1="938" y1="434" x2="1038" y2="434" stroke="#8a7a5a" stroke-width="1.5"/>
      <line x1="938" y1="442" x2="1018" y2="442" stroke="#8a7a5a" stroke-width="1.5"/>
      <rect x="1060" y="420" width="26" height="40" rx="3" fill="#2a2a3a"/>
      <rect x="1100" y="424" width="38" height="26" rx="4" fill="#3a3a4a"/>

      <!-- 立柱 -->
      <rect x="36" y="40" width="34" height="680" fill="#7a2a20" stroke="#4a1a12" stroke-width="3"/>
      <rect x="1210" y="40" width="34" height="680" fill="#7a2a20" stroke="#4a1a12" stroke-width="3"/>

      <!-- 灯笼 -->
      <g>
        <line x1="230" y1="120" x2="230" y2="172" stroke="#1f1208" stroke-width="3"/>
        <ellipse cx="230" cy="204" rx="32" ry="38" fill="#c0392b" stroke="#7a1a10" stroke-width="3"/>
        <rect x="224" y="162" width="12" height="15" rx="3" fill="#d9b06a"/>
        <text x="230" y="213" text-anchor="middle" font-size="24" fill="#ffdf9a" font-family="KaiTi,serif">官</text>
      </g>
      <g>
        <line x1="1050" y1="120" x2="1050" y2="172" stroke="#1f1208" stroke-width="3"/>
        <ellipse cx="1050" cy="204" rx="32" ry="38" fill="#c0392b" stroke="#7a1a10" stroke-width="3"/>
        <rect x="1044" y="162" width="12" height="15" rx="3" fill="#d9b06a"/>
        <text x="1050" y="213" text-anchor="middle" font-size="24" fill="#ffdf9a" font-family="KaiTi,serif">官</text>
      </g>
    </svg>
  </div>

  <!-- 回忆插画层 -->
  <div class="c2-cg" id="c2Cg"><div id="c2CgInner"></div></div>

  <!-- 角色 -->
  <div class="c2-char hero" id="c2Hero"><img src="assets/hero.png" alt="角丝旁"></div>
  <div class="c2-char magistrate" id="c2Mag"><img src="assets/magistrate.png" alt="县长"></div>

  <!-- 过渡横幅 -->
  <div class="c2-banner" id="c2Banner"><span id="c2BannerText"></span><div class="hint">▼ 点击继续</div></div>

  <!-- 剧情条 -->
  <div class="dialog" id="c2Dialog" style="display:none">
    <span class="speaker narrator" id="c2DialogSpeaker">旁白</span>
    <div class="text"><span id="c2DialogText"></span><span class="caret" id="c2Caret">▌</span></div>
    <span class="next" id="c2DialogNext" style="display:none">▼ 点击继续</span>
  </div>

  <!-- 音效 -->
  <button class="btn small c2-music" id="c2BtnMusic">♪ 音效：开</button>
  <div class="c2-progress" id="c2Progress">第二章</div>

  <!-- 结局 -->
  <div class="c2-end" id="c2End">
    <div class="result-card">
      <div class="tag">—— 角丝旁行侠记 · 第二章 ——</div>
      <div class="title">第二章 · 完</div>
      <div class="desc" id="c2EndDesc">猛虎为患，百姓遭殃。<br>角丝旁应下此事，明日便进山除虎——</div>
      <div class="actions">
        <button class="btn primary" id="c2BtnReplay">再 看 一 遍</button>
        <button class="btn" id="c2BtnCh1">回 第 一 章</button>
        <button class="btn" id="c2BtnTitle">返 回 标 题</button>
      </div>
    </div>
  </div>
</div>

<script src="js/audio.js?v=2"></script>
<script src="js/chapter2.js?v=1"></script>
</body>
</html>
