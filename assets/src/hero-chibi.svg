<svg viewBox="0 0 340 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h_hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a4c"/><stop offset="1" stop-color="#1e1e2c"/></linearGradient>
    <linearGradient id="h_robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d94a3a"/><stop offset="1" stop-color="#a83232"/></linearGradient>
    <linearGradient id="h_white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8e2d4"/></linearGradient>
    <linearGradient id="h_blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#eef2f6"/><stop offset="1" stop-color="#b8c6d2"/></linearGradient>
  </defs>

  <!-- 后发（含两条辫子） -->
  <path d="M 122 130 C 110 210 112 300 124 372 C 132 384 148 376 150 358 L 156 230 C 158 214 182 214 184 230 L 190 358 C 192 376 208 384 216 372 C 228 300 230 210 218 130 Z" fill="url(#h_hair)"/>
  <!-- 后辫 -->
  <path d="M 130 300 C 122 340 118 376 124 398 C 132 404 142 394 142 376 L 140 330 C 140 320 136 308 130 300 Z" fill="#2a2a3c"/>
  <path d="M 210 300 C 218 340 222 376 216 398 C 208 404 198 394 198 376 L 200 330 C 200 320 204 308 210 300 Z" fill="#2a2a3c"/>
  <!-- 辫尾绳结 -->
  <rect x="120" y="396" width="20" height="6" rx="3" fill="#1a1a24"/>
  <rect x="200" y="396" width="20" height="6" rx="3" fill="#1a1a24"/>

  <!-- 身体：红衣 -->
  <path d="M 116 206 C 112 250 114 292 170 306 C 226 292 228 250 224 206 L 216 194 C 192 206 188 206 164 194 C 156 196 128 198 116 206 Z" fill="url(#h_robe)"/>
  <!-- 白领 -->
  <path d="M 170 210 L 138 250 L 170 300 L 202 250 Z" fill="url(#h_white)"/>
  <!-- 黄边 -->
  <path d="M 116 206 C 112 250 114 292 170 306 C 226 292 228 250 224 206" fill="none" stroke="#e8c15a" stroke-width="3"/>
  <!-- 云纹 -->
  <path d="M 128 224 Q 136 216 144 224 M 196 224 Q 204 216 212 224 M 130 268 Q 138 260 146 268 M 194 268 Q 202 260 210 268" stroke="#8a2626" stroke-width="2" fill="none" opacity=".6"/>
  <!-- 盘扣 -->
  <g fill="#e8c15a">
    <circle cx="170" cy="248" r="3.2"/>
    <circle cx="170" cy="270" r="3.2"/>
    <circle cx="170" cy="292" r="3.2"/>
  </g>
  <!-- 下摆红结 -->
  <path d="M 170 306 L 181 322 L 170 331 L 159 322 Z" fill="#a83232"/>
  <path d="M 170 331 L 166 344 M 170 331 L 174 344" stroke="#8a2626" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 腰带 -->
  <rect x="112" y="292" width="116" height="10" rx="5" fill="#d9b06a"/>
  <path d="M 170 292 L 170 302" stroke="#b8862b" stroke-width="2"/>

  <!-- 腿（白裤） -->
  <rect x="134" y="304" width="30" height="96" rx="12" fill="url(#h_white)"/>
  <rect x="176" y="304" width="30" height="96" rx="12" fill="url(#h_white)"/>
  <!-- 左腿蓝珠 -->
  <g fill="#4a7ab8">
    <circle cx="158" cy="330" r="2.4"/>
    <circle cx="158" cy="340" r="2.4"/>
    <circle cx="158" cy="350" r="2.4"/>
  </g>
  <!-- 脚（黄环） -->
  <ellipse cx="149" cy="404" rx="20" ry="9" fill="#3a2a20"/>
  <ellipse cx="191" cy="404" rx="20" ry="9" fill="#3a2a20"/>
  <ellipse cx="149" cy="402" rx="15" ry="4.6" fill="none" stroke="#e8c15a" stroke-width="2.6"/>
  <ellipse cx="191" cy="402" rx="15" ry="4.6" fill="none" stroke="#e8c15a" stroke-width="2.6"/>

  <!-- 左臂（观者右侧） -->
  <path d="M 222 208 C 234 236 238 270 228 296 C 218 302 208 290 208 272 L 212 236 C 214 224 220 214 222 208 Z" fill="url(#h_robe)"/>
  <circle cx="224" cy="304" r="10" fill="#ffe0c4"/>

  <!-- 剑（观者左侧，右手持） -->
  <g transform="rotate(-14 108 300)">
    <path d="M 104 58 C 106 64 110 76 110 88 L 110 290 Q 110 300 103 300 Q 96 300 96 290 L 96 88 C 96 76 102 64 104 58 Z" fill="url(#h_blade)" stroke="#2b2320" stroke-width="1.6"/>
    <line x1="103" y1="70" x2="103" y2="292" stroke="#9fb0c0" stroke-width="1.2" opacity=".7"/>
    <line x1="99" y1="90" x2="99" y2="288" stroke="#ffffff" stroke-width="1.6" opacity=".9"/>
    <path d="M 78 296 Q 103 284 128 296 Q 131 306 127 310 Q 103 300 79 310 Q 75 306 78 296 Z" fill="#d9b06a" stroke="#8a5a20" stroke-width="1.6"/>
    <rect x="96" y="308" width="14" height="52" rx="4" fill="#4a3626" stroke="#2b2018" stroke-width="1.4"/>
    <g stroke="#c0392b" stroke-width="4">
      <line x1="98" y1="318" x2="108" y2="314"/>
      <line x1="98" y1="326" x2="108" y2="322"/>
      <line x1="98" y1="334" x2="108" y2="330"/>
      <line x1="98" y1="342" x2="108" y2="338"/>
    </g>
    <rect x="94" y="360" width="18" height="8" rx="3" fill="#b8862b"/>
    <path d="M 103 368 C 100 380 104 388 100 398" stroke="#c0392b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 100 398 C 95 410 90 420 84 428 M 100 398 C 100 412 100 424 100 430 M 100 398 C 105 410 110 420 116 428" stroke="#d64545" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 右手（握剑） -->
  <circle cx="110" cy="308" r="10" fill="#ffe0c4" stroke="#e0b898" stroke-width="1"/>

  <!-- 头 -->
  <ellipse cx="170" cy="150" rx="50" ry="56" fill="#ffe0c4"/>
  <!-- 头发 -->
  <path d="M 122 132 C 116 78 150 54 170 54 C 190 54 224 78 218 132 C 208 100 194 92 170 92 C 146 92 132 100 122 132 Z" fill="url(#h_hair)"/>
  <path d="M 128 116 Q 148 100 170 108 Q 192 100 212 116 L 208 132 Q 190 122 170 126 Q 150 122 132 132 Z" fill="url(#h_hair)"/>
  <path d="M 122 132 C 118 168 118 200 126 222 C 132 212 132 190 130 170 C 130 160 128 148 124 138 Z" fill="url(#h_hair)"/>
  <path d="M 218 132 C 222 168 222 200 214 222 C 208 212 208 190 210 170 C 210 160 212 148 216 138 Z" fill="url(#h_hair)"/>
  <!-- 白色交叉发饰 -->
  <g stroke="#f4f4f4" stroke-width="4" stroke-linecap="round">
    <line x1="203" y1="104" x2="213" y2="96"/>
    <line x1="213" y1="104" x2="203" y2="96"/>
  </g>
  <!-- 头顶蓝珠链 -->
  <path d="M 166 58 Q 170 50 179 52" stroke="#4a7ab8" stroke-width="2" fill="none"/>
  <circle cx="166" cy="58" r="2.2" fill="#4a7ab8"/>
  <circle cx="179" cy="52" r="2.2" fill="#4a7ab8"/>
  <!-- 阴阳鱼坠（红穗） -->
  <path d="M 180 54 L 189 70" stroke="#2a2a3c" stroke-width="2.4"/>
  <circle cx="191" cy="76" r="6" fill="#1a1a24" stroke="#e8c15a" stroke-width="1.2"/>
  <path d="M 191 72 A 3 3 0 0 0 191 78 A 3 3 0 0 1 191 81 Z" fill="#f2f2f2"/>
  <path d="M 191 82 C 189 88 189 92 191 96" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M 191 96 L 189 104 M 191 96 L 193 104" stroke="#d64545" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <ellipse cx="150" cy="154" rx="9" ry="11" fill="#fff"/>
  <ellipse cx="190" cy="154" rx="9" ry="11" fill="#fff"/>
  <ellipse cx="152" cy="156" rx="5.5" ry="7" fill="#c8a25a"/>
  <ellipse cx="188" cy="156" rx="5.5" ry="7" fill="#c8a25a"/>
  <circle cx="153" cy="154" r="2.4" fill="#1a1410"/>
  <circle cx="189" cy="154" r="2.4" fill="#1a1410"/>
  <circle cx="150" cy="152" r="1.6" fill="#fff"/>
  <circle cx="186" cy="152" r="1.6" fill="#fff"/>
  <!-- 腮红 -->
  <ellipse cx="138" cy="170" rx="7" ry="4.5" fill="#f0a0a0" opacity=".55"/>
  <ellipse cx="202" cy="170" rx="7" ry="4.5" fill="#f0a0a0" opacity=".55"/>
  <!-- 嘴 -->
  <path d="M 164 177 Q 170 181 176 177" stroke="#b05a4a" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- 项链（蓝珠 + 阴阳鱼） -->
  <path d="M 148 210 Q 170 232 192 210" stroke="#3a5a8a" stroke-width="2.2" fill="none"/>
  <circle cx="148" cy="210" r="2.6" fill="#4a7ab8"/>
  <circle cx="158" cy="219" r="2.6" fill="#4a7ab8"/>
  <circle cx="182" cy="219" r="2.6" fill="#4a7ab8"/>
  <circle cx="192" cy="210" r="2.6" fill="#4a7ab8"/>
  <circle cx="170" cy="228" r="5" fill="#1a1a24" stroke="#e8c15a" stroke-width="1"/>
  <path d="M 170 225 A 2.5 2.5 0 0 0 170 230 A 2.5 2.5 0 0 1 170 232 Z" fill="#f2f2f2"/>
</svg>
