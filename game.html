<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>角丝旁行侠记 · 拔刀相助</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23a83232'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23f4e9d0' font-family='KaiTi,serif'%3E%E4%BE%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="game">
  <div class="scene">
    <!-- 场景一：古道茶摊 -->
    <div class="scene-layer bg-trail" data-bg="bg-trail">
      <div class="sun"></div>
      <div class="far-hill"></div>
      <div class="near-hill"></div>
      <div class="bamboo" style="left:5%;bottom:15%;height:130px;--rot:8deg"><span class="leaf" style="top:14px;left:8px"></span><span class="leaf" style="top:56px;left:8px"></span></div>
      <div class="bamboo" style="left:90%;bottom:14%;height:104px;--rot:-10deg"><span class="leaf" style="top:10px;left:8px"></span><span class="leaf" style="top:46px;left:8px"></span></div>
      <svg class="stall" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 138 L 20 96 L 40 100 L 32 138 Z" fill="#6b4a2f"/>
        <path d="M 190 138 L 180 96 L 160 100 L 168 138 Z" fill="#6b4a2f"/>
        <path d="M 6 100 Q 100 52 194 100 L 186 88 Q 100 44 14 88 Z" fill="#a87a3a"/>
        <path d="M 0 104 Q 100 60 200 104 L 200 112 Q 100 70 0 112 Z" fill="#8a5f2e"/>
        <rect x="86" y="70" width="28" height="24" rx="3" fill="#e8d9b8"/>
        <text x="100" y="87" text-anchor="middle" font-size="14" fill="#5a3a22" font-family="KaiTi,serif">茶</text>
        <rect x="70" y="120" width="60" height="18" rx="4" fill="#5a3a22"/>
      </svg>
      <div class="ground"></div>
    </div>

    <!-- 场景二：众贼来犯（茶摊近景） -->
    <div class="scene-layer bg-trail bg-village" data-bg="bg-village">
      <div class="sun" style="opacity:.85"></div>
      <div class="far-hill" style="opacity:.9"></div>
      <svg class="stall" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" style="left:26%;width:min(clamp(440px, 72vh, 800px), 46vw)">
        <path d="M 10 138 L 20 96 L 40 100 L 32 138 Z" fill="#5a3a22"/>
        <path d="M 190 138 L 180 96 L 160 100 L 168 138 Z" fill="#5a3a22"/>
        <path d="M 6 100 Q 100 52 194 100 L 186 88 Q 100 44 14 88 Z" fill="#96682e"/>
        <path d="M 0 104 Q 100 60 200 104 L 200 112 Q 100 70 0 112 Z" fill="#7a5426"/>
        <rect x="86" y="70" width="28" height="24" rx="3" fill="#d9c6a0"/>
        <text x="100" y="87" text-anchor="middle" font-size="14" fill="#4a3018" font-family="KaiTi,serif">茶</text>
        <rect x="70" y="120" width="60" height="18" rx="4" fill="#4a3018"/>
      </svg>
      <div class="bamboo" style="left:8%;bottom:15%;height:120px"><span class="leaf" style="top:12px;left:8px"></span></div>
      <div class="ground"></div>
    </div>

    <!-- 场景三：黑风寨 -->
    <div class="scene-layer bg-stronghold" data-bg="bg-stronghold">
      <div class="moon-slim"></div>
      <div class="far-hill" style="opacity:.7"></div>
      <svg class="gate" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="30" width="18" height="120" fill="#3a2418"/>
        <rect x="172" y="30" width="18" height="120" fill="#3a2418"/>
        <rect x="10" y="20" width="200" height="26" rx="4" fill="#4a2e1c"/>
        <rect x="10" y="20" width="200" height="10" fill="#5a3a24"/>
        <rect x="54" y="46" width="112" height="104" fill="#2a1a12"/>
        <rect x="54" y="46" width="112" height="12" fill="#3a2418"/>
        <text x="110" y="112" text-anchor="middle" font-size="24" fill="#d9b06a" font-family="KaiTi,serif">黑风寨</text>
        <circle cx="110" cy="52" r="10" fill="none" stroke="#d9b06a" stroke-width="2"/>
      </svg>
      <svg class="brazier" viewBox="0 0 120 260" xmlns="http://www.w3.org/2000/svg" style="left:8%;bottom:13%;width:min(80px,9vw)">
        <path d="M 60 58 C 55 76 50 84 50 91 C 50 99 54 103 60 103 C 66 103 70 99 70 91 C 70 84 65 76 60 58 Z" fill="#c94520" opacity=".85"/>
        <path d="M 60 66 C 56 80 53 86 53 91 C 53 97 56 100 60 100 C 64 100 67 97 67 91 C 67 86 64 80 60 66 Z" fill="#e87a30"/>
        <path d="M 60 76 C 58 84 56 88 56 91 C 56 95 58 97 60 97 C 62 97 64 95 64 91 C 64 88 62 84 60 76 Z" fill="#ffdf90"/>
        <ellipse cx="60" cy="104" rx="15" ry="6" fill="#e87a30" opacity=".4"/>
        <ellipse cx="60" cy="104" rx="34" ry="11" fill="#1c1c26" stroke="#3c3c4e" stroke-width="4"/>
        <ellipse cx="60" cy="102" rx="26" ry="7" fill="none" stroke="#3c3c4e" stroke-width="2.5"/>
        <line x1="42" y1="102" x2="78" y2="102" stroke="#3c3c4e" stroke-width="3"/>
        <rect x="53" y="104" width="14" height="92" rx="5" fill="#26262f"/>
        <rect x="56" y="104" width="4" height="92" fill="#4a4a5c" opacity=".45"/>
        <ellipse cx="60" cy="150" rx="17" ry="7" fill="none" stroke="#26262f" stroke-width="5"/>
        <ellipse cx="60" cy="168" rx="11" ry="5" fill="none" stroke="#3c3c4e" stroke-width="4"/>
        <path d="M 60 196 L 33 240 L 24 247 Q 19 252 27 254 L 41 246 L 60 204 Z" fill="#26262f"/>
        <path d="M 60 196 L 87 240 L 96 247 Q 101 252 93 254 L 79 246 L 60 204 Z" fill="#26262f"/>
        <path d="M 60 196 L 60 254 L 68 254 L 68 204 Z" fill="#26262f"/>
        <path d="M 33 240 Q 24 236 22 226 Q 21 218 29 218 Q 35 218 35 226" fill="none" stroke="#26262f" stroke-width="4" stroke-linecap="round"/>
        <path d="M 87 240 Q 96 236 98 226 Q 99 218 91 218 Q 85 218 85 226" fill="none" stroke="#26262f" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <svg class="brazier" viewBox="0 0 120 260" xmlns="http://www.w3.org/2000/svg" style="left:84%;bottom:13%;width:min(80px,9vw)">
        <path d="M 60 58 C 55 76 50 84 50 91 C 50 99 54 103 60 103 C 66 103 70 99 70 91 C 70 84 65 76 60 58 Z" fill="#c94520" opacity=".85"/>
        <path d="M 60 66 C 56 80 53 86 53 91 C 53 97 56 100 60 100 C 64 100 67 97 67 91 C 67 86 64 80 60 66 Z" fill="#e87a30"/>
        <path d="M 60 76 C 58 84 56 88 56 91 C 56 95 58 97 60 97 C 62 97 64 95 64 91 C 64 88 62 84 60 76 Z" fill="#ffdf90"/>
        <ellipse cx="60" cy="104" rx="15" ry="6" fill="#e87a30" opacity=".4"/>
        <ellipse cx="60" cy="104" rx="34" ry="11" fill="#1c1c26" stroke="#3c3c4e" stroke-width="4"/>
        <ellipse cx="60" cy="102" rx="26" ry="7" fill="none" stroke="#3c3c4e" stroke-width="2.5"/>
        <line x1="42" y1="102" x2="78" y2="102" stroke="#3c3c4e" stroke-width="3"/>
        <rect x="53" y="104" width="14" height="92" rx="5" fill="#26262f"/>
        <rect x="56" y="104" width="4" height="92" fill="#4a4a5c" opacity=".45"/>
        <ellipse cx="60" cy="150" rx="17" ry="7" fill="none" stroke="#26262f" stroke-width="5"/>
        <ellipse cx="60" cy="168" rx="11" ry="5" fill="none" stroke="#3c3c4e" stroke-width="4"/>
        <path d="M 60 196 L 33 240 L 24 247 Q 19 252 27 254 L 41 246 L 60 204 Z" fill="#26262f"/>
        <path d="M 60 196 L 87 240 L 96 247 Q 101 252 93 254 L 79 246 L 60 204 Z" fill="#26262f"/>
        <path d="M 60 196 L 60 254 L 68 254 L 68 204 Z" fill="#26262f"/>
        <path d="M 33 240 Q 24 236 22 226 Q 21 218 29 218 Q 35 218 35 226" fill="none" stroke="#26262f" stroke-width="4" stroke-linecap="round"/>
        <path d="M 87 240 Q 96 236 98 226 Q 99 218 91 218 Q 85 218 85 226" fill="none" stroke="#26262f" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="near-hill" style="opacity:.5"></div>
      <div class="ground"></div>
    </div>
  </div>

  <!-- 战斗区 -->
  <div class="arena" id="arena">
    <div class="blade" id="blade"></div>
    <div id="sword"><img src="assets/sword.png" alt="普通剑"></div>
    <div class="entity hero-entity" id="heroEntity">
      <img class="hero" src="assets/hero.png" alt="角丝旁">
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <button class="btn small" id="btnTitle">← 标题</button>
    <div class="bar hero">
      <div class="label">角丝旁</div>
      <div class="track"><div class="fill" id="heroBarFill" style="width:100%"></div></div>
    </div>
    <div class="bar bossbar" id="bossBar">
      <div class="label">山寨主</div>
      <div class="track"><div class="fill" id="bossBarFill" style="width:100%"></div></div>
    </div>
    <span class="spacer"></span>
    <span class="wave-tag" id="waveTag">第一战 · 古道茶摊</span>
    <button class="btn small" id="btnMusic">♪ 音效：开</button>
  </div>

  <!-- 剧情条 -->
  <div class="dialog" id="dialog" style="display:none">
    <span class="speaker narrator" id="dialogSpeaker">旁白</span>
    <div class="text"><span id="dialogText"></span><span class="caret" id="caret">▌</span></div>
    <span class="next" id="dialogNext" style="display:none">▼ 点击继续</span>
  </div>

  <!-- 触屏控制 -->
  <div class="touch-ctrl">
    <button class="tbtn tleft" id="tleft">◀</button>
    <button class="tbtn tright" id="tright">▶</button>
    <button class="tbtn tatk" id="tatk">拔 剑</button>
  </div>

  <div class="hurt-flash" id="hurtFlash"></div>
  <div class="controls-hint">← → 移动 · 空格 / J / 点击 挥剑</div>

  <!-- 结果 -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="tag">—— 角丝旁行侠记 ——</div>
      <div class="title" id="resultTitle"></div>
      <div class="desc" id="resultDesc"></div>
      <div class="actions">
        <button class="btn primary" id="btnRetry">再 战 一 场</button>
        <button class="btn" id="btnCh2" style="display:none">进 入 第 二 章</button>
        <button class="btn" id="btnTitleEnd">返 回 标 题</button>
      </div>
    </div>
  </div>
</div>

<script src="js/audio.js?v=1"></script>
<script src="js/game.js?v=1"></script>
</body>
</html>
